apply plugin: 'com.android.application'

def applicationName = "MCStatus"

android {
    defaultConfig {
        applicationId "net.justdave.mcstatus"
        minSdk = 19
        targetSdk = 37
        versionCode 15
        versionName '1.1'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
            signingConfig getSigningConfig()
        }
    }
    productFlavors {
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    ndkVersion '28.2.13676358'
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
    namespace 'net.justdave.mcstatus'
    compileSdk = 37

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

androidComponents {
    onVariants(selector().all(), { variant ->
        variant.outputs.forEach { output ->
            def nameSuffix = variant.name == 'release' ? '' : "-${variant.name}"
            def version = output.versionName.get()
            output.outputFileName.set("${applicationName}${nameSuffix}-${version}.apk")
        }
    })
}

dependencies {
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260719'
}
